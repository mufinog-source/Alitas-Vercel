<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel de pedidos — ALITA’S</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#211916;background:#f6efe6}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.card{background:#fffaf3;border:1px solid #e4d6c6;border-radius:14px;padding:18px;margin-bottom:14px}.login{max-width:420px;margin:10vh auto}.field{width:100%;padding:12px;border:1px solid #d9c9ba;border-radius:8px;margin:6px 0 14px;background:white}button,select{font:inherit}button{border:0;border-radius:8px;padding:10px 14px;background:#211916;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#e9ded2;color:#211916}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.muted{color:#75675f;font-size:.85rem}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{font-size:.78rem;border-radius:99px;padding:5px 9px;background:#eee4d9}.orderline{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.error{color:#a8231f}.hidden{display:none}h1{font-size:1.4rem}h2{font-size:1.1rem}
</style></head><body><main><section id="login" class="card login"><h1>ALITA’S — Funcionários</h1><p class="muted">Inicia sessão com a conta autorizada pela administração.</p><label>Email</label><input id="email" class="field" type="email" autocomplete="username"><label>Palavra-passe</label><input id="password" class="field" type="password" autocomplete="current-password"><button id="loginBtn">Entrar</button><p id="loginError" class="error"></p></section>
<section id="dashboard" class="hidden"><header><div><h1>Painel de pedidos</h1><p class="muted">Pedidos actualizados automaticamente.</p></div><div><button class="secondary" id="refresh">Actualizar</button> <button id="logout">Sair</button></div></header><div class="row"><h2>Pedidos recentes</h2><span id="lastUpdate" class="muted"></span></div><div id="orders" class="grid"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='COLOCA_AQUI_SUPABASE_URL',SUPABASE_ANON_KEY='COLOCA_AQUI_SUPABASE_ANON_KEY';
let sb=null,session=null,timer=null,idleTimer=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses=['Recebido','Confirmado','Em preparação','Saiu para entrega','Pronto para levantamento','Entregue','Cancelado'];
if(!SUPABASE_URL.startsWith('COLOCA'))sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
$('#loginBtn').onclick=async()=>{if(!sb){$('#loginError').textContent='Configura primeiro o Supabase URL e a chave pública neste ficheiro.';return}$('#loginBtn').disabled=true;const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});$('#loginBtn').disabled=false;if(error){$('#loginError').textContent=error.message;return}session=data.session;await start()};
async function start(){if(!session)return;resetIdle();$('#login').classList.add('hidden');$('#dashboard').classList.remove('hidden');await refresh();clearInterval(timer);timer=setInterval(refresh,15000)}
async function refresh(){if(!session)return;try{const r=await fetch('/api/admin-orders',{headers:{Authorization:'Bearer '+session.access_token}});const rows=await r.json();if(!r.ok)throw new Error(rows.error||'Erro');$('#orders').innerHTML=rows.length?rows.map(o=>`<article class="card"><div class="row"><b>Pedido #${esc(o.id.slice(0,8).toUpperCase())}</b><span class="pill">${esc(o.status)}</span></div><p class="muted">${new Date(o.created_at).toLocaleString('pt-PT')}</p><p><b>${esc(o.customer_name)}</b> · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></p><p class="muted">${esc(o.fulfillment)} · ${esc(o.store_name)} · ${esc(o.zone||'')}</p>${o.address?`<p>${esc(o.address)}</p>`:''}${(o.items||[]).map(i=>`<div class="orderline"><span>${esc(i.quantity)} × ${esc(i.name)}</span><b>${(i.quantity*i.unit_price).toLocaleString('pt-PT')} MT</b></div>`).join('')}<hr><div class="orderline"><span>Subtotal</span><b>${Number(o.subtotal).toLocaleString('pt-PT')} MT</b></div><div class="orderline"><span>Entrega</span><b>${o.delivery_fee===null?'A confirmar':Number(o.delivery_fee).toLocaleString('pt-PT')+' MT'}</b></div><div class="orderline"><b>Total</b><b>${Number(o.total).toLocaleString('pt-PT')} MT</b></div>${o.notes?`<p><b>Observações:</b> ${esc(o.notes)}</p>`:''}<label>Actualizar estado</label><div class="row"><select class="field statusSelect" data-id="${esc(o.id)}">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><button class="updateBtn" data-id="${esc(o.id)}">Guardar</button></div></article>`).join(''):'<div class="card">Ainda não há pedidos.</div>';
 document.querySelectorAll('.updateBtn').forEach(b=>b.onclick=()=>updateStatus(b.dataset.id));$('#lastUpdate').textContent='Actualizado às '+new Date().toLocaleTimeString('pt-PT');
 }catch(e){$('#orders').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
async function updateStatus(id){const status=document.querySelector(`.statusSelect[data-id="${CSS.escape(id)}"]`).value;const r=await fetch('/api/admin-orders',{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({id,status})});const d=await r.json();if(!r.ok){alert(d.error||'Não foi possível actualizar.');return}await refresh()}
function resetIdle(){clearTimeout(idleTimer);idleTimer=setTimeout(()=>logout(),30*60*1000)}
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(session)resetIdle()},{passive:true}));
async function logout(){clearInterval(timer);clearTimeout(idleTimer);await sb.auth.signOut();session=null;$('#dashboard').classList.add('hidden');$('#login').classList.remove('hidden')}
$('#logout').onclick=logout;
if(sb)sb.auth.getSession().then(async({data})=>{session=data.session;if(session)await start()});
if(sb)sb.auth.onAuthStateChange((_event,newSession)=>{session=newSession;if(!newSession){clearInterval(timer);$('#dashboard').classList.add('hidden');$('#login').classList.remove('hidden')}});
</script></body></html>
